name: XGBoost upstream release watcher

# Weekly (and on-demand) watch on dmlc/xgboost. When a release newer than the version
# pinned in build.rs appears, Claude reviews the upstream C API header diff and edits the
# crate (version, required header checksums, wrappers); a dedicated action then opens ONE
# pull request. Nothing here can push to the base branch or publish a release — the only
# remote write is the PR itself.
#
# Auth: workload identity federation (no stored API key). Requires repo secrets:
#   ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID, ANTHROPIC_SERVICE_ACCOUNT_ID
#   (ANTHROPIC_WORKSPACE_ID only if the federation rule spans multiple workspaces)
# Recommended: a branch-protection rule on the default branch requiring PRs.

on:
  schedule:
    - cron: '40 6 * * 1'   # Mondays 06:40 UTC (staggered)
  workflow_dispatch:

permissions:
  id-token: write         # fetch the GitHub OIDC token for Anthropic WIF
  contents: write         # minimum GitHub allows for creating a PR branch
  pull-requests: write    # open/update the PR

jobs:
  propose-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false   # the edit step gets NO git push credentials

      - name: Determine current and latest versions
        id: versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT=$(grep 'unwrap_or_else' build.rs | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [ -n "$CURRENT" ] || { echo "::error::Could not find pinned version in build.rs"; exit 1; }
          LATEST=$(gh api "repos/dmlc/xgboost/releases/latest" --jq '.tag_name' | sed 's/^v//')
          [ -n "$LATEST" ] || { echo "::error::Could not fetch latest release"; exit 1; }

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST"   >> "$GITHUB_OUTPUT"
          echo "Current pinned: $CURRENT | Latest upstream: $LATEST"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
          elif [ "$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | tail -1)" = "$LATEST" ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pinned version is newer than upstream latest; nothing to do."
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if an update PR is already open
        id: existing
        if: steps.versions.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="chore/xgboost-${{ steps.versions.outputs.latest }}"
          if gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number' | grep -q '[0-9]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build header diff and compute checksums
        id: diff
        if: steps.versions.outputs.update == 'true' && steps.existing.outputs.skip == 'false'
        env:
          CURRENT: ${{ steps.versions.outputs.current }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/header-diff.txt"
          : > "$OUT"
          for name in c_api.h base.h; do
            h="include/xgboost/${name}"
            old=$(curl -fsSL "https://raw.githubusercontent.com/dmlc/xgboost/v${CURRENT}/${h}" 2>/dev/null || true)
            newfile="$RUNNER_TEMP/new_${name}"
            curl -fsSL "https://raw.githubusercontent.com/dmlc/xgboost/v${LATEST}/${h}" -o "$newfile" 2>/dev/null || true
            new=$(cat "$newfile" 2>/dev/null || true)
            [ -z "$old" ] && [ -z "$new" ] && continue
            echo "===== ${h}  (v${CURRENT} -> v${LATEST}) =====" >> "$OUT"
            diff -u <(printf '%s' "$old") <(printf '%s' "$new") >> "$OUT" || true
            echo >> "$OUT"
          done
          CAPI_SHA=$(sha256sum "$RUNNER_TEMP/new_c_api.h" 2>/dev/null | cut -d' ' -f1)
          BASE_SHA=$(sha256sum "$RUNNER_TEMP/new_base.h" 2>/dev/null | cut -d' ' -f1)
          printf '## XGBoost v%s\n\nBump from v%s. Release notes: https://github.com/dmlc/xgboost/releases/tag/v%s\n' \
            "$LATEST" "$CURRENT" "$LATEST" > "$RUNNER_TEMP/pr-body.md"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "capi_sha=$CAPI_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Wrote header diff to $OUT ($(wc -l < "$OUT") lines)"
          echo "c_api.h sha256=$CAPI_SHA | base.h sha256=$BASE_SHA"

      - name: Claude — review diff and edit the crate (no push access)
        if: steps.versions.outputs.update == 'true' && steps.existing.outputs.skip == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          # Workload identity federation — exchanges the GitHub OIDC token for a
          # short-lived Anthropic credential. Do NOT also set anthropic_api_key.
          anthropic_federation_rule_id: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          claude_args: |
            --allowedTools Bash,Edit,Write,Read,Glob,Grep
            --max-turns 40
            --model claude-opus-4-8
          prompt: |
            You are preparing a dependency update for the Rust crate `xgboost-rust`, which
            wraps the XGBoost C API. You can ONLY edit files. Do NOT run git, do NOT commit,
            push, or open a PR — a later workflow step does that from your changes. There
            are no push credentials available to you.

            Upstream dmlc/xgboost has a newer release:
              current pinned version: v${{ steps.versions.outputs.current }}
              new version:            v${{ steps.versions.outputs.latest }}

            Precomputed header SHA256 checksums for v${{ steps.versions.outputs.latest }}:
              c_api.h: ${{ steps.diff.outputs.capi_sha }}
              base.h:  ${{ steps.diff.outputs.base_sha }}

            Do the following:

            1. In build.rs, bump the default version returned by `get_xgboost_version()`
               from ${{ steps.versions.outputs.current }} to ${{ steps.versions.outputs.latest }}.

            2. CRITICAL: build.rs verifies downloaded headers against a SHA256 map in
               `get_header_checksums()`; the build FAILS for any version not in that map.
               Add an entry for "${{ steps.versions.outputs.latest }}" mapping to the
               precomputed (c_api.h, base.h) checksums above, matching the existing entry
               format exactly. If a checksum above is empty, download the header at the tag
               and compute it with sha256sum.

            3. Read the upstream C API header diff: `cat "${{ steps.diff.outputs.path }}"`.
               Analyze it for changes affecting this crate, and check whether
               `emit_version_cfg_flags` / version-specific logic in build.rs needs updating.

               IMPORTANT: the raw FFI in src/sys.rs is generated by bindgen at build time
               (`include!(concat!(env!("OUT_DIR"), "/bindings.rs"))`) — do NOT hand-write or
               edit FFI declarations. Only modify the SAFE WRAPPER layer (src/model.rs,
               src/lib.rs, src/error.rs) where the diff actually requires it. Be conservative
               and minimal.

            4. Add the new version to the CI test matrix in .github/workflows/ci.yml,
               following the existing per-OS/arch pattern, so future runs exercise it.

            5. If feasible run `cargo build` (then `cargo test`). The build downloads platform
               libraries and may fail for environment reasons — if so, note it and continue.

            6. Write the pull-request body to the file "${{ runner.temp }}/pr-body.md"
               (overwrite it). It must contain:
                 - the bump (v${{ steps.versions.outputs.current }} -> v${{ steps.versions.outputs.latest }}),
                   the release-notes link, and the checksums you added.
                 - a "## Code review" section: an honest review of the C API diff — what
                   changed, what it means for this crate, and exactly what you changed and why
                   (or that no wrapper changes were required).
                 - a "## Needs human verification" checklist (release wheels present for every
                   platform/manylinux tag, build/test on real targets, etc.).

      - name: Ensure PR labels exist
        if: steps.versions.outputs.update == 'true' && steps.existing.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create dependencies --force >/dev/null 2>&1 || true
          gh label create upstream-release --force >/dev/null 2>&1 || true

      - name: Create pull request
        if: steps.versions.outputs.update == 'true' && steps.existing.outputs.skip == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/xgboost-${{ steps.versions.outputs.latest }}
          commit-message: "chore: update XGBoost to v${{ steps.versions.outputs.latest }}"
          title: "chore: update XGBoost to v${{ steps.versions.outputs.latest }}"
          body-path: ${{ runner.temp }}/pr-body.md
          labels: dependencies, upstream-release
          delete-branch: true
